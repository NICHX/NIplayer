# 堆上限由 2G 提到 4G：15 个模块 + Compose + KSP + NDK 的构建在 2G 下偏紧
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：对 15 模块项目可省掉每次构建的配置阶段。
# 已用 `./gradlew testDebugUnitTest --configuration-cache` 全量验证通过，
# 第二次运行配置阶段从数秒降至 ~0.5s（"Reusing configuration cache"）。
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
