# detekt 配置（工程化 E5）
#
# 策略：**显式白名单**，而不是「默认规则集减去噪声规则」。
#
# 1. `buildUponDefaultConfig = false`，本文件是唯一真相；未在此启用的规则一律关闭。
#    这样 detekt 升级默认规则集时不会静默改变本项目的门禁范围 —— CI 的红绿只由本文件决定。
# 2. 当前只启用**能在存量代码上全绿**的高信号规则。规则集扩充的路径是：
#    新增一条规则 → 全量跑一次 → 修掉真实问题（或明确记录为有意豁免）→ 才允许留在白名单里。
#    不允许「先把规则全打开、再加一堆 ignore」的写法，那等于把门禁变成噪声。
# 3. 每条被有意关闭的规则都在下方以 `active: false` 保留，便于后续逐条评估开启成本。
#
# 维护：本文件由 detekt 默认配置裁剪而来，结构（规则集 / 规则名 / 配置键）与上游一一对应，
# 因此可以直接把上游默认值粘回来作为调参起点。

