# SpreadOperator：实测 3 处全部是 vararg API 的必需展开 ——
#   NiSnackbarHost 的 stringResource(id, vararg Any)、ExtendFolderBackupTable / VideoScanner 的
#   Room @Insert(vararg entity)。规则本意是「先用 toTypedArray() 再展开」造成的一次数组拷贝，
#   但这两个场景没有 List 重载可换，属微优化而非缺陷。若要保留信号，应改为给 DAO 增加 List 重载，
#   而不是靠这条规则报警。
