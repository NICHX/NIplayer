# SuspendFunInFinallySection：**已修复并启用**（2026-09-21，11 处全部处理完毕）。
#   修法：finally 里的 suspend 清理包进**裸** `withContext(NonCancellable) { suspendCall() }`；
#   对「必须吞掉 close 失败」或「必须指定 IO 调度器」的 2 处，改为把清理**移出 finally**
#   （前提：同一 try 的 catch 都不重抛，故清理必然执行）。
  SuspendFunInFinallySection:
    active: true
# SuspendFunSwallowedCancellation：**已修复并启用**（2026-09-21，89 处全部处理完毕）。
#   已修 87 处：core/thumbnail 14 · core/storage 8 · core/sync 1 · feature/player 16（有 src/test）
#         · feature/home 37（`StorageFileViewModel` 的 13 处 runCatching 统一改用新增的
#         `runCatchingSuspending` 帮助函数）· 以及两模块 11 处 finally 清理的配套改造。
#   另有 2 处**显式豁免**（`@Suppress("SuspendFunSwallowedCancellation")`，理由写在调用点）：
#         DownloadManager.processTask / UploadManager.processTask —— 在**任务边界有意吞掉取消**
#         （把取消转成任务的 CANCELLED / PAUSED 终态），与已被 DownloadManagerCancelRaceTest
#         变异验证过的 cancel/pause 竞态设计耦合；改成「首条语句重抛」会丢掉
#         cancellingTasks.remove(...) 等非 suspend 副作用。
#   ⚠️ 规则语义（2026-09-21 用探针实测，非文档推测）：
#     重抛必须是**独立 catch 子句的首条语句**。以下写法**都会被报**：
#       · `catch (e: Exception) { if (e is CancellationException) throw e; … }`（守卫式，非首条）
#       · `catch (e: Exception) { …; throw e }`（末尾无条件重抛）
#       · `catch (e: CancellationException) { log(); throw e }`（重抛非首条）
#     唯一被接受的写法：`catch (e: CancellationException) { throw e }` 紧随 try、位于宽 catch 之前。
#   ⚠️ finally 里的 suspend 清理：只接受**裸** `withContext(NonCancellable) { suspendCall() }`。
#     以下写法**仍会被报**：`Dispatchers.IO + NonCancellable`、`NonCancellable + Dispatchers.IO`、
#     `withContext(NonCancellable) { withContext(IO) { … } }`、以及在其外包 try/catch。
#     且在 finally 内 `throw` 会触发已启用的 ThrowingExceptionFromFinally —— 两条规则互相冲突。
#     结论：凡「必须吞掉 close 失败」或「必须指定 IO 调度器」的清理，正确做法是把清理**移出 finally**
#     （前提是同一 try 的 catch 都不重抛，故清理必然执行）。
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

