name: CI

on:
  pull_request:
    branches-ignore: [ 'v*' ]
  push:
    branches-ignore: [ 'v*' ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必须用 JDK 21，不能用 17。
      #
      # 根因：`:core:database` 的 MigrationTest 走 Robolectric，而 Robolectric 在
      # emulated SDK 37（= targetSdk）下要求**运行它的 JVM ≥ Java 21**，否则在创建
      # sandbox 时直接抛：
      #   UnsupportedOperationException: Failed to create a Robolectric sandbox:
      #   Android SDK 37 requires Java 21 (have Java 17)
      #
      # 为什么本地不暴露：`gradle/gradle-daemon-jvm.properties` 声明了
      # `toolchainVersion=21`，Gradle 会据此为**守护进程**自动下载并切换到 JDK 21。
      # 但该文件在 `.gitignore` 里，**CI 的干净检出没有它** ——
      # 守护进程只能退回用 workflow 提供的 JDK，于是 17 就炸了。
      #
      # 即「本地全绿、CI 挂」的成因是**构建环境隐式依赖一个未入库的文件**。
      # 这里显式给 21 消除该差异；lint job 同样需要 21（见其自带注释）。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 新版 runner 镜像无 tools 包且已预装 platform-tools，跳过显式安装包，
          # 让 AGP 在接受许可下按需自动下载缺失的 platform/build-tools
          packages: ''

      - name: Ensure NDK & CMake
        run: |
          # NDK 版本从 gradle/libs.versions.toml 读取（与 player:ffmpeg 的 ndkVersion 同源），
          # 避免两处各自硬编码漂移 —— 历史上此处安装的是 26.1.10909125，
          # 而模块声明的是 28.2.13676358，该步骤等于无效。
          NDK_VERSION=$(grep -E '^ndk[[:space:]]*=' gradle/libs.versions.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$NDK_VERSION" ]; then
            echo "::error::无法从 gradle/libs.versions.toml 读取 ndk 版本"
            exit 1
          fi
          echo "NDK_VERSION=$NDK_VERSION"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ] || [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            yes | sdkmanager "ndk;$NDK_VERSION" "cmake;3.22.1" >/dev/null
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  static-analysis:
    name: Static Analysis (detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Ensure NDK & CMake
        run: |
          NDK_VERSION=$(grep -E '^ndk[[:space:]]*=' gradle/libs.versions.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$NDK_VERSION" ]; then
            echo "::error::无法从 gradle/libs.versions.toml 读取 ndk 版本"
            exit 1
          fi
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ] || [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            yes | sdkmanager "ndk;$NDK_VERSION" "cmake;3.22.1" >/dev/null
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 必须用 detektMain / detektTest（带类型解析），不能用裸 `detekt`：
      # 后者没有绑定上下文，ForbiddenMethodCall、MissingUseCall、UnusedImport 等
      # 依赖符号解析的规则会静默地一条都不报 —— 看起来启用、实则形同虚设。
      # 规则白名单与各条关闭理由见 config/detekt/detekt.yml 头部。
      - name: Run detekt
        run: ./gradlew detektMain detektTest

      - name: Upload detekt reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**'
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.3.0 的 lint 工具内部依赖 JDK 21 的 List.removeLast()（JDK 17 会抛
      # NoSuchMethodError），因此 lint 任务单独用 JDK 21 运行。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 新版 runner 镜像无 tools 包且已预装 platform-tools，跳过显式安装包，
          # 让 AGP 在接受许可下按需自动下载缺失的 platform/build-tools
          packages: ''

      - name: Ensure NDK & CMake
        run: |
          # NDK 版本从 gradle/libs.versions.toml 读取（与 player:ffmpeg 的 ndkVersion 同源），
          # 避免两处各自硬编码漂移 —— 历史上此处安装的是 26.1.10909125，
          # 而模块声明的是 28.2.13676358，该步骤等于无效。
          NDK_VERSION=$(grep -E '^ndk[[:space:]]*=' gradle/libs.versions.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$NDK_VERSION" ]; then
            echo "::error::无法从 gradle/libs.versions.toml 读取 ndk 版本"
            exit 1
          fi
          echo "NDK_VERSION=$NDK_VERSION"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ] || [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            yes | sdkmanager "ndk;$NDK_VERSION" "cmake;3.22.1" >/dev/null
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore
