name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成 release notes 需要完整历史与全部 tag，用于计算「上一版本 → 本版本」提交区间
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure NDK & CMake
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ] || [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            yes | sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" >/dev/null
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/niplayer-release.keystore"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/niplayer-release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE secret 未配置，将构建未签名 APK"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename release artifact
        run: |
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/NIplayer-${GITHUB_REF_NAME}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          BODY="$RUNNER_TEMP/RELEASE_NOTES.md"

          APK_SIZE="$(ls -lh app/build/outputs/apk/release/*.apk 2>/dev/null | awk '{print $5}' || true)"
          if [ -z "$APK_SIZE" ]; then APK_SIZE="—"; fi

          {
            echo "## 🎬 NIplayer ${VERSION}"
            echo ""
            echo "> 发布时间：$(date -u +'%Y-%m-%d') ｜ 支持 Android 8.0+"
          } > "$BODY"

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
            {
              echo "> 变更范围：[\`${PREV_TAG}...${GITHUB_REF_NAME}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME})"
              echo ""
            } >> "$BODY"
          else
            RANGE="${GITHUB_REF_NAME}"
            {
              echo "> 🎉 首个版本"
              echo ""
            } >> "$BODY"
          fi

          # 按 Conventional Commits 前缀分类展示提交，并给出对应 commit 短哈希
          git log --no-merges --pretty=format:'%h|%s' "$RANGE" > "$RUNNER_TEMP/commits.txt"
          if [ ! -s "$RUNNER_TEMP/commits.txt" ]; then
            echo -e "\n**本版本无新增提交。**" >> "$BODY"
          fi

          write_group() {
            local emoji="$1" title="$2" pattern="$3" first=1
            local sha subject desc
            while IFS='|' read -r sha subject; do
              case "$subject" in
                ${pattern})
                  if [ "$first" -eq 1 ]; then
                    printf '\n### %s %s\n\n' "$emoji" "$title" >> "$BODY"
                    first=0
                  fi
                  desc="${subject#*: }"
                  if [ "$desc" = "$subject" ]; then desc="$subject"; fi
                  printf -- '- %s (`%s`)\n' "$desc" "${sha:0:7}" >> "$BODY"
                  ;;
              esac
            done < "$RUNNER_TEMP/commits.txt"
          }

          write_group "✨" "新功能" "feat*"
          write_group "🐛" "问题修复" "fix*"
          write_group "⚡" "性能优化" "perf*"
          write_group "♻️" "重构" "refactor*"
          write_group "📝" "文档" "docs*"
          write_group "🔧" "CI / 构建" "ci*"
          write_group "🧪" "测试" "test*"
          write_group "🧹" "杂项" "chore*"

          # 兜底分组：未带约定前缀的提交
          unmatched=0
          while IFS='|' read -r sha subject; do
            case "$subject" in
              feat*|fix*|perf*|refactor*|docs*|ci*|test*|chore*|style*|build*|revert*) continue ;;
            esac
            if [ "$unmatched" -eq 0 ]; then
              printf '\n### 📦 其他\n\n' >> "$BODY"
              unmatched=1
            fi
            printf -- '- %s (`%s`)\n' "$subject" "${sha:0:7}" >> "$BODY"
          done < "$RUNNER_TEMP/commits.txt"

          {
            echo ""
            echo "---"
            echo ""
            echo "## 📥 安装"
            echo ""
            echo "- **APK**：\`NIplayer-${GITHUB_REF_NAME}.apk\`（约 ${APK_SIZE}，直接安装，含 arm64-v8a / armeabi-v7a）"
            echo ""
            echo "> 💡 首次安装请在系统设置中允许「安装未知来源应用」；升级覆盖安装即可，历史数据保留。"
            echo ""
            echo "## 🔒 关于签名"
            echo ""
            echo "本版本由 GitHub Actions 使用 Release 密钥签名。安装时如提示与应用签名不一致，请先卸载旧版本再安装（会导致本地数据清空）。"
          } >> "$BODY"

          echo "body_path=$BODY" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
          body_path: ${{ steps.release_notes.outputs.body_path }}
